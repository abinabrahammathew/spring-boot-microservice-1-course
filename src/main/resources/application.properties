server.port=${SERVER_PORT:3333}
spring.application.name=course-service
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:db_course}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}

eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:6666/eureka/}

service.security.secure-key-username=courseuser
service.security.secure-key-password=passwords